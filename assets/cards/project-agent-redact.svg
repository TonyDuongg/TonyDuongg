  <text x="129.6" y="217.5" font-size="12.5" font-weight="400" fill="#ffcd38" text-anchor="start">Node.js</text>
  <rect x="190.2" y="200" width="60.9" height="26" fill="#4a1216"/>
  <text x="200.2" y="217.5" font-size="12.5" font-weight="400" fill="#ffcd38" text-anchor="start">Python</text>
