<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 250" width="412" height="250" role="img" aria-label="agent-redact: Local secret and PII redactor for AI agents. Masks API keys, database URLs and personal data before a prompt leaves the machine, and restores them in the answer.">
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    
  </style>
  <rect width="412" height="250" fill="#2a0709"/>
  <text x="28" y="40" font-size="13" font-weight="400" fill="#cfa84a" text-anchor="start">Open-source library</text>
  <text x="384" y="40" font-size="13" font-weight="400" fill="#cfa84a" text-anchor="end">Public · npm, PyPI</text>
  <text x="28" y="80" font-size="26" font-weight="700" fill="#ffcd38" text-anchor="start">agent-redact</text>
  <text x="28" y="112" font-size="14" font-weight="400" fill="#ffcd38" text-anchor="start">Local secret and PII redactor for AI agents. Masks</text>
  <text x="28" y="132" font-size="14" font-weight="400" fill="#ffcd38" text-anchor="start">API keys, database URLs and personal data before a</text>
