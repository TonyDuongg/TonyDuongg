  <text x="796" y="157.5" font-size="13" font-weight="400" fill="#a2a5a9" text-anchor="end">PostgreSQL</text>
  <rect x="500" y="170" width="308" height="26" fill="#1f2125"/>
  <text x="512" y="187.5" font-size="13" font-weight="400" fill="#e8e6e1" text-anchor="start">Script job</text>
