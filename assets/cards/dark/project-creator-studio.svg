  <text x="375.9" y="263.5" font-size="12.5" font-weight="400" fill="#e8e6e1" text-anchor="start">AWS SQS</text>
  <text x="808" y="44" font-size="13" font-weight="400" fill="#a2a5a9" text-anchor="end">Public · v1.1.0</text>
  <text x="500" y="66" font-size="13" font-weight="400" fill="#a2a5a9" text-anchor="start">One script request</text>
  <rect x="500" y="80" width="308" height="26" fill="#1f2125"/>
  <text x="512" y="97.5" font-size="13" font-weight="400" fill="#e8e6e1" text-anchor="start">Channel ingest</text>
  <text x="796" y="97.5" font-size="13" font-weight="400" fill="#a2a5a9" text-anchor="end">RapidAPI</text>
