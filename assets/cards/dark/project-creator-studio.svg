<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="Creator Studio: Reads public TikTok channels, ranks their videos by engagement and writes three-part short-video scripts: a 3-second hook, the body and a call to action. Script jobs run through AWS SQS, and a job that fails lands in a dead-letter queue and refunds its credits.">
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    
  </style>
  <rect width="840" height="300" fill="#17181b"/>
  <text x="32" y="44" font-size="13" font-weight="400" fill="#a2a5a9" text-anchor="start">Backend service and desktop app</text>
  <text x="32" y="92" font-size="38" font-weight="700" fill="#e8e6e1" text-anchor="start">Creator Studio</text>
  <text x="32" y="128" font-size="14.5" font-weight="400" fill="#e8e6e1" text-anchor="start">Reads public TikTok channels, ranks their videos by</text>
  <text x="32" y="149" font-size="14.5" font-weight="400" fill="#e8e6e1" text-anchor="start">engagement and writes three-part short-video scripts: a</text>
  <text x="32" y="170" font-size="14.5" font-weight="400" fill="#e8e6e1" text-anchor="start">3-second hook, the body and a call to action. Script jobs run</text>
  <text x="32" y="191" font-size="14.5" font-weight="400" fill="#e8e6e1" text-anchor="start">through AWS SQS, and a job that fails lands in a dead-letter</text>
  <text x="32" y="212" font-size="14.5" font-weight="400" fill="#e8e6e1" text-anchor="start">queue and refunds its credits.</text>
  <rect x="32.0" y="246" width="66.9" height="26" fill="#272a2f"/>
  <text x="42" y="263.5" font-size="12.5" font-weight="400" fill="#e8e6e1" text-anchor="start">Java 21</text>
  <rect x="104.9" y="246" width="100.9" height="26" fill="#272a2f"/>
  <text x="114.9" y="263.5" font-size="12.5" font-weight="400" fill="#e8e6e1" text-anchor="start">Spring Boot 3</text>
  <rect x="211.8" y="246" width="90.8" height="26" fill="#272a2f"/>
  <text x="221.8" y="263.5" font-size="12.5" font-weight="400" fill="#e8e6e1" text-anchor="start">PostgreSQL</text>
  <rect x="308.5" y="246" width="51.4" height="26" fill="#272a2f"/>
  <text x="318.5" y="263.5" font-size="12.5" font-weight="400" fill="#e8e6e1" text-anchor="start">Redis</text>
