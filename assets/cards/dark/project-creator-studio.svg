  <text x="796" y="247.5" font-size="13" font-weight="400" fill="#a2a5a9" text-anchor="end">saved</text>
  <rect x="500" y="260" width="308" height="26" fill="#1f2125"/>
  <text x="512" y="277.5" font-size="13" font-weight="400" fill="#e8e6e1" text-anchor="start">Failed job</text>
  <text x="796" y="277.5" font-size="13" font-weight="400" fill="#a2a5a9" text-anchor="end">DLQ, credits back</text>
