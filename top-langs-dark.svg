<svg width="380" height="212" viewBox="0 0 380 212" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Languages in my repositories">
  <style>
    .card-title {
      font: 600 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      fill: #e8e6e1;
    }
    .lang-label {
      font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      fill: #e8e6e1;
    }
    .lang-pct {
      font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      fill: #a2a5a9;
    }
    .card-bg {
      fill: #17181b;
    }
  </style>

  <rect class="card-bg" width="380" height="212" />

  <!-- Title -->
  <text x="25" y="38" class="card-title">Languages in my repositories</text>

  <!-- Progress Bar -->
  <g transform="translate(25, 55)">
    <mask id="bar-mask">
      <rect x="0" y="0" width="330" height="8" fill="white" />
    </mask>
    <g mask="url(#bar-mask)">
      <rect x="0" y="0" width="146.4" height="8" fill="#b07219" /><rect x="146.4" y="0" width="76.3" height="8" fill="#3178c6" /><rect x="222.7" y="0" width="71.9" height="8" fill="#f1e05a" /><rect x="294.6" y="0" width="18.9" height="8" fill="#663399" /><rect x="313.5" y="0" width="8.7" height="8" fill="#e34c26" /><rect x="322.2" y="0" width="3.8" height="8" fill="#3572A5" /><rect x="326.0" y="0" width="2.1" height="8" fill="#41b883" /><rect x="328.1" y="0" width="1.9" height="8" fill="#336790" />
    </g>
  </g>

  <!-- Languages List (2 Columns) -->
  <g>
    
    <g transform="translate(25, 95)">
      <rect x="1" y="1" width="10" height="10" fill="#b07219" />
      <text x="18" y="10" class="lang-label">Java</text>
      <text x="150" y="10" text-anchor="end" class="lang-pct">44.4%</text>
    </g>
    <g transform="translate(190, 95)">
      <rect x="1" y="1" width="10" height="10" fill="#3178c6" />
      <text x="18" y="10" class="lang-label">TypeScript</text>
      <text x="150" y="10" text-anchor="end" class="lang-pct">23.1%</text>
    </g>
    <g transform="translate(25, 123)">
      <rect x="1" y="1" width="10" height="10" fill="#f1e05a" />
      <text x="18" y="10" class="lang-label">JavaScript</text>
      <text x="150" y="10" text-anchor="end" class="lang-pct">21.8%</text>
    </g>
    <g transform="translate(190, 123)">
      <rect x="1" y="1" width="10" height="10" fill="#663399" />
      <text x="18" y="10" class="lang-label">CSS</text>
      <text x="150" y="10" text-anchor="end" class="lang-pct">5.7%</text>
    </g>
    <g transform="translate(25, 151)">
      <rect x="1" y="1" width="10" height="10" fill="#e34c26" />
      <text x="18" y="10" class="lang-label">HTML</text>
      <text x="150" y="10" text-anchor="end" class="lang-pct">2.6%</text>
    </g>
    <g transform="translate(190, 151)">
      <rect x="1" y="1" width="10" height="10" fill="#3572A5" />
      <text x="18" y="10" class="lang-label">Python</text>
      <text x="150" y="10" text-anchor="end" class="lang-pct">1.2%</text>
    </g>
    <g transform="translate(25, 179)">
      <rect x="1" y="1" width="10" height="10" fill="#41b883" />
      <text x="18" y="10" class="lang-label">Vue</text>
      <text x="150" y="10" text-anchor="end" class="lang-pct">0.6%</text>
    </g>
    <g transform="translate(190, 179)">
      <rect x="1" y="1" width="10" height="10" fill="#336790" />
      <text x="18" y="10" class="lang-label">PLpgSQL</text>
      <text x="150" y="10" text-anchor="end" class="lang-pct">0.6%</text>
    </g>
  </g>
</svg>
