<svg width="380" height="212" viewBox="0 0 380 212" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most Used Languages">
  <style>
    .card-title {
      font: 600 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      fill: #58a6ff;
    }
    .lang-label {
      font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      fill: #c9d1d9;
    }
    .lang-pct {
      font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      fill: #8b949e;
    }
    .card-bg {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1;
      rx: 8;
    }
  </style>

  <rect class="card-bg" width="378" height="210" x="1" y="1" />

  <!-- Title -->
  <text x="25" y="38" class="card-title">Most Used Languages</text>

  <!-- Progress Bar -->
  <g transform="translate(25, 55)">
    <mask id="bar-mask">
      <rect x="0" y="0" width="330" height="8" rx="4" fill="white" />
    </mask>
    <g mask="url(#bar-mask)">
      <rect x="0" y="0" width="158.0" height="8" fill="#b07219" /><rect x="158.0" y="0" width="87.9" height="8" fill="#3178c6" /><rect x="245.9" y="0" width="53.8" height="8" fill="#f1e05a" /><rect x="299.7" y="0" width="21.0" height="8" fill="#663399" /><rect x="320.7" y="0" width="4.1" height="8" fill="#e34c26" /><rect x="324.8" y="0" width="2.6" height="8" fill="#41b883" /><rect x="327.40000000000003" y="0" width="1.8" height="8" fill="#336790" /><rect x="329.20000000000005" y="0" width="0.9" height="8" fill="#3572A5" />
    </g>
  </g>

  <!-- Languages List (2 Columns) -->
  <g>
    
    <g transform="translate(25, 95)">
      <circle cx="6" cy="6" r="5" fill="#b07219" />
      <text x="18" y="10" class="lang-label">Java</text>
      <text x="150" y="10" text-anchor="end" class="lang-pct">47.9%</text>
    </g>
    <g transform="translate(190, 95)">
      <circle cx="6" cy="6" r="5" fill="#3178c6" />
      <text x="18" y="10" class="lang-label">TypeScript</text>
      <text x="150" y="10" text-anchor="end" class="lang-pct">26.6%</text>
    </g>
    <g transform="translate(25, 123)">
      <circle cx="6" cy="6" r="5" fill="#f1e05a" />
      <text x="18" y="10" class="lang-label">JavaScript</text>
      <text x="150" y="10" text-anchor="end" class="lang-pct">16.3%</text>
    </g>
    <g transform="translate(190, 123)">
      <circle cx="6" cy="6" r="5" fill="#663399" />
      <text x="18" y="10" class="lang-label">CSS</text>
      <text x="150" y="10" text-anchor="end" class="lang-pct">6.3%</text>
    </g>
    <g transform="translate(25, 151)">
      <circle cx="6" cy="6" r="5" fill="#e34c26" />
      <text x="18" y="10" class="lang-label">HTML</text>
      <text x="150" y="10" text-anchor="end" class="lang-pct">1.2%</text>
    </g>
    <g transform="translate(190, 151)">
      <circle cx="6" cy="6" r="5" fill="#41b883" />
      <text x="18" y="10" class="lang-label">Vue</text>
      <text x="150" y="10" text-anchor="end" class="lang-pct">0.8%</text>
    </g>
    <g transform="translate(25, 179)">
      <circle cx="6" cy="6" r="5" fill="#336790" />
      <text x="18" y="10" class="lang-label">PLpgSQL</text>
      <text x="150" y="10" text-anchor="end" class="lang-pct">0.5%</text>
    </g>
    <g transform="translate(190, 179)">
      <circle cx="6" cy="6" r="5" fill="#3572A5" />
      <text x="18" y="10" class="lang-label">Python</text>
      <text x="150" y="10" text-anchor="end" class="lang-pct">0.3%</text>
    </g>
  </g>
</svg>
