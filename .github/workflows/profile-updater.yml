name: Update Profile Metrics & Snake

on:
  schedule:
    - cron: "0 0 * * *" # Tự động chạy lúc 00:00 UTC mỗi ngày
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Generate Top Languages Card (Public & Private Repos)
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GH_TOKEN || secrets.PAT || secrets.TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_langs.py

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: TonyDuongg
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Deploy SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
