name: Update Profile Metrics & Snake

on:
  schedule:
    - cron: "0 0 * * *" # Tự động chạy lúc 00:00 UTC mỗi ngày
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Generate Top Languages Card (Public & Private Repos)
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GH_TOKEN || secrets.PAT || secrets.TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_langs.py

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: TonyDuongg
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/snake-tonyd-dark.svg?color_snake=#ffcd38&color_dots=#3a0d10,#6b2416,#a3471c,#e08a2a,#ffcd38
            dist/snake-tonyd-light.svg?color_snake=#2a0709&color_dots=#efe6d6,#f5d27a,#e0a43a,#a3471c,#5c1a16

      - name: Deploy SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
